services:
  backend:
    build: ./backend
    container_name: orenexa-backend
    ports:
      - "8010:8010"
    volumes:
      - backend_state:/app/app/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8010/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: orenexa-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_state:
